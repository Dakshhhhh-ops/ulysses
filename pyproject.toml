[project]
name = "flagsmith-ulysses"
version = "0.1.0"
description = "Signed stop contracts for Flagsmith experiments: an agent may ship the winner only when the contract fires."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43",
    "fastapi>=0.115",
    "flagsmith>=6.7.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "mcp>=1.9",
    "numpy>=2.0",
    "pydantic>=2.8",
    "rich>=13.7",
    "scipy>=1.13",
    "tomli-w>=1.0",
    "uvicorn>=0.30",
]

[project.scripts]
ulysses = "ulysses.cli:main"
flagsmith-ulysses = "ulysses.cli:main"

[project.optional-dependencies]
gemini = [
    "google-genai>=3.6",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ulysses"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: needs a running Flagsmith (set ULYSSES_LIVE=1 and the FLAGSMITH_* variables)",
]
asyncio_default_fixture_loop_scope = "function"
