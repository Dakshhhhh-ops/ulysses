# A throwaway, stock open-source Flagsmith for trying Ulysses: pinned release, Experimentation on,
# experiment events stored in Flagsmith's own Postgres. Nothing here is modified Flagsmith code.
#
#   uv run python scripts/judge_demo.py        # brings this up, bootstraps it and runs the demo
#   docker compose -p ulysses down -v          # removes it and its data
#
# The Flagsmith API and dashboard listen on http://localhost:8280 (set ULYSSES_FLAGSMITH_PORT to move it).
#
# The `agent` profile adds the agent side of the split in its own container (the scripted agent and
# the Ulysses MCP server). It is not started by a plain `up`; the judge demo runs it with
# `--agent-in-container`. It gets the Ulysses URL and agent token and nothing else: no volume, no
# env_file, a read-only filesystem, and its own network, so it cannot reach Flagsmith's Postgres.
name: ulysses

x-flagsmith-env: &flagsmith-env
  DATABASE_URL: postgresql://postgres:password@postgres:5432/flagsmith
  ENVIRONMENT: production
  DJANGO_ALLOWED_HOSTS: '*'
  FLAGSMITH_DOMAIN: localhost:${ULYSSES_FLAGSMITH_PORT:-8280}
  DJANGO_SECRET_KEY: ulysses-throwaway-local-secret
  WAREHOUSE_CREDENTIALS_SECRET: ulysses-throwaway-warehouse-secret
  USE_POSTGRES_FOR_ANALYTICS: 'true'
  EXPERIMENTATION_ENABLED: 'true'
  # Results, exposures and webhooks run on Flagsmith's task processor, as in a normal deployment.
  # (Run synchronously, a webhook is delivered while the request that caused it is still open.)
  TASK_RUN_METHOD: TASK_PROCESSOR
  TASK_PROCESSOR_NUM_THREADS: '4'
  TASK_PROCESSOR_SLEEP_INTERVAL_MS: '250'
  # The contract service runs on the host; Flagsmith refuses webhooks to private addresses unless listed.
  SSRF_ALLOWED_HOSTS: 'host.docker.internal'
  GUNICORN_WORKERS: '2'
  GUNICORN_THREADS: '4'

x-image: &image docker.flagsmith.com/flagsmith/flagsmith:2.295.2@sha256:48905c664152d8ae2c843ec9cee72ff197e7caff6e91b959bb851a235915ea35

volumes:
  pgdata:

networks:
  # The agent's network: shared with no other service. It reaches the contract service on the host.
  agent-only: {}

services:
  postgres:
    image: postgres:15.5-alpine
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: flagsmith
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d flagsmith -U postgres']
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 20s
    mem_limit: 512m

  migrate-db:
    image: *image
    command: ['migrate']
    environment:
      <<: *flagsmith-env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  flagsmith:
    image: *image
    command: ['serve']
    environment:
      <<: *flagsmith-env
    ports:
      - '127.0.0.1:${ULYSSES_FLAGSMITH_PORT:-8280}:8000'
    extra_hosts:
      # Linux has no host.docker.internal by default; Docker Desktop does.
      - 'host.docker.internal:host-gateway'
    depends_on:
      migrate-db:
        condition: service_completed_successfully
    mem_limit: 1g

  flagsmith-task-processor:
    image: *image
    command: ['run-task-processor']
    environment:
      <<: *flagsmith-env
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      migrate-db:
        condition: service_completed_successfully
    mem_limit: 640m

  agent:
    profiles: ['agent']
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    image: ulysses-agent:local
    environment:
      ULYSSES_URL: ${ULYSSES_AGENT_URL:-http://host.docker.internal:8240}
      ULYSSES_AGENT_TOKEN: ${ULYSSES_AGENT_TOKEN:-}
    networks: ['agent-only']
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    read_only: true
    tmpfs:
      - /tmp
    user: '10001:10001'
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    mem_limit: 384m
